<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Metabolite Detail — MolExplorer</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:ital,wght@0,300;0,400;0,500;1,400&family=Syne:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0a0e0d;
    --bg2: #111714;
    --bg3: #1a2219;
    --border: rgba(74,200,120,0.15);
    --border-bright: rgba(74,200,120,0.4);
    --green: #4ac878;
    --green-dim: rgba(74,200,120,0.08);
    --text: #e8f5ee;
    --text-dim: #7a9e85;
    --text-muted: #3d5e47;
    --mono: 'DM Mono', monospace;
    --sans: 'Syne', sans-serif;
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    min-height: 100vh;
  }

  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(rgba(74,200,120,0.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(74,200,120,0.03) 1px, transparent 1px);
    background-size: 40px 40px;
    pointer-events: none;
    z-index: 0;
  }

  nav {
    position: sticky;
    top: 0;
    z-index: 100;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 1rem 2rem;
    background: rgba(10,14,13,0.9);
    backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--border);
  }

  .nav-logo {
    font-size: 1.1rem;
    font-weight: 700;
    letter-spacing: 0.05em;
    color: var(--green);
    text-decoration: none;
  }

  .nav-logo span { color: var(--text-dim); font-weight: 400; }

  nav a {
    font-family: var(--mono);
    font-size: 0.78rem;
    color: var(--text-dim);
    text-decoration: none;
    letter-spacing: 0.05em;
    transition: color 0.2s;
  }

  nav a:hover { color: var(--green); }
  nav ul { list-style: none; display: flex; gap: 2rem; }

  .page {
    position: relative;
    z-index: 1;
    max-width: 1200px;
    margin: 0 auto;
    padding: 2.5rem 2rem 5rem;
  }

  .breadcrumb {
    font-family: var(--mono);
    font-size: 0.72rem;
    color: var(--text-muted);
    letter-spacing: 0.08em;
    margin-bottom: 2rem;
  }

  .breadcrumb a { color: var(--green); text-decoration: none; }

  /* header info */
  .ligand-header {
    display: grid;
    grid-template-columns: 1fr auto;
    gap: 1.5rem;
    align-items: start;
    margin-bottom: 2.5rem;
    padding-bottom: 2rem;
    border-bottom: 1px solid var(--border);
  }

  .ligand-code {
    font-family: var(--mono);
    font-size: 0.72rem;
    letter-spacing: 0.12em;
    color: var(--green);
    text-transform: uppercase;
    margin-bottom: 0.4rem;
  }

  .ligand-name {
    font-size: 2rem;
    font-weight: 800;
    letter-spacing: -0.02em;
    line-height: 1.1;
    margin-bottom: 1rem;
  }

  .ligand-meta {
    display: flex;
    gap: 1.5rem;
    flex-wrap: wrap;
  }

  .meta-item {
    display: flex;
    flex-direction: column;
    gap: 0.2rem;
  }

  .meta-item label {
    font-family: var(--mono);
    font-size: 0.65rem;
    letter-spacing: 0.1em;
    color: var(--text-muted);
    text-transform: uppercase;
  }

  .meta-item span {
    font-family: var(--mono);
    font-size: 0.88rem;
    color: var(--text);
  }

  .header-actions { display: flex; flex-direction: column; gap: 0.6rem; align-items: flex-end; }

  .btn {
    font-family: var(--mono);
    font-size: 0.72rem;
    letter-spacing: 0.08em;
    padding: 0.55rem 1rem;
    border-radius: 3px;
    cursor: pointer;
    text-decoration: none;
    display: inline-flex;
    align-items: center;
    gap: 0.4rem;
    transition: all 0.15s;
    border: 1px solid transparent;
    white-space: nowrap;
  }

  .btn-outline {
    background: transparent;
    color: var(--text-dim);
    border-color: var(--border-bright);
  }

  .btn-outline:hover { color: var(--green); border-color: var(--green); background: var(--green-dim); }

  /* filters */
  .filters {
    background: var(--bg2);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 1.4rem;
    margin-bottom: 2rem;
    display: grid;
    grid-template-columns: 1fr 1fr 1fr auto;
    gap: 0.8rem;
    align-items: end;
  }

  .filter-group { display: flex; flex-direction: column; gap: 0.4rem; }

  .filter-group label {
    font-family: var(--mono);
    font-size: 0.65rem;
    letter-spacing: 0.1em;
    color: var(--text-muted);
    text-transform: uppercase;
  }

  .filter-group input, .filter-group select {
    background: var(--bg3);
    border: 1px solid var(--border-bright);
    color: var(--text);
    font-family: var(--mono);
    font-size: 0.82rem;
    padding: 0.6rem 0.9rem;
    border-radius: 3px;
    outline: none;
    transition: border-color 0.2s;
  }

  .filter-group input::placeholder { color: var(--text-muted); }
  .filter-group input:focus, .filter-group select:focus { border-color: var(--green); }
  .filter-group select option { background: var(--bg3); }

  .btn-apply {
    background: var(--green);
    color: #0a0e0d;
    border: none;
    font-family: var(--mono);
    font-size: 0.75rem;
    font-weight: 500;
    letter-spacing: 0.08em;
    padding: 0.65rem 1.4rem;
    border-radius: 3px;
    cursor: pointer;
    transition: opacity 0.2s;
    white-space: nowrap;
  }

  .btn-apply:hover { opacity: 0.85; }

  /* results info bar */
  .results-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 1.2rem;
  }

  .results-count {
    font-family: var(--mono);
    font-size: 0.75rem;
    color: var(--text-muted);
  }

  .results-count strong { color: var(--green); }

  /* protein grid */
  .protein-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: 1px;
    background: var(--border);
    border: 1px solid var(--border);
  }

  .protein-card {
    background: var(--bg2);
    transition: background 0.15s;
    cursor: pointer;
    text-decoration: none;
    display: block;
    overflow: hidden;
  }

  .protein-card:hover { background: var(--bg3); }

  .protein-img {
    width: 100%;
    aspect-ratio: 1;
    object-fit: cover;
    display: block;
    background: var(--bg3);
    border-bottom: 1px solid var(--border);
    filter: saturate(0.6) brightness(0.9);
    transition: filter 0.3s;
  }

  .protein-card:hover .protein-img { filter: saturate(1) brightness(1); }

  .protein-info {
    padding: 0.9rem 1rem;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .protein-id {
    font-family: var(--mono);
    font-size: 0.95rem;
    font-weight: 500;
    letter-spacing: 0.08em;
    color: var(--text);
  }

  .protein-arrow {
    font-family: var(--mono);
    font-size: 0.75rem;
    color: var(--text-muted);
    transition: color 0.15s;
  }

  .protein-card:hover .protein-arrow { color: var(--green); }

  /* states */
  .state-msg {
    font-family: var(--mono);
    font-size: 0.8rem;
    padding: 3rem 2rem;
    text-align: center;
    color: var(--text-muted);
    border: 1px solid var(--border);
    border-radius: 4px;
  }

  .state-msg.loading { color: var(--green); }
  .state-msg.error { color: #f07070; border-color: rgba(220,50,50,0.3); }

  .load-more {
    margin-top: 1px;
    width: 100%;
    background: var(--bg2);
    border: none;
    border-top: 1px solid var(--border);
    color: var(--text-dim);
    font-family: var(--mono);
    font-size: 0.75rem;
    letter-spacing: 0.08em;
    padding: 1.1rem;
    cursor: pointer;
    transition: all 0.15s;
    display: none;
  }

  .load-more:hover { background: var(--bg3); color: var(--green); }
</style>
</head>
<body>

<nav>
  <a href="index.html" class="nav-logo">Mol<span>Explorer</span></a>
  <ul>
    <li><a href="index.html">Home</a></li>
    <li><a href="search.html">Search</a></li>
    <li><a href="https://www.rcsb.org" target="_blank">RCSB PDB ↗</a></li>
  </ul>
</nav>

<div class="page">
  <div class="breadcrumb"><a href="index.html">Home</a> / <span id="bc-id">...</span></div>

  <!-- filled by JS -->
  <div class="ligand-header" id="ligand-header">
    <div>
      <div class="ligand-code" id="lcode">Loading...</div>
      <div class="ligand-name" id="lname">—</div>
      <div class="ligand-meta" id="lmeta"></div>
    </div>
    <div class="header-actions" id="lactions"></div>
  </div>

  <!-- filters -->
  <div class="filters">
    <div class="filter-group">
      <label>Organism</label>
      <input type="text" id="f-organism" placeholder="e.g. Homo sapiens" />
    </div>
    <div class="filter-group">
      <label>Keyword</label>
      <input type="text" id="f-keyword" placeholder="e.g. kinase, receptor" />
    </div>
    <div class="filter-group">
      <label>Gene</label>
      <input type="text" id="f-gene" placeholder="e.g. EGFR, TP53" />
    </div>
    <button class="btn-apply" onclick="loadProteins(true)">Apply →</button>
  </div>

  <div class="results-bar">
    <div class="results-count" id="results-count"></div>
  </div>

  <div id="protein-grid-wrap">
    <div class="state-msg loading">// initialising ...</div>
  </div>

  <button class="load-more" id="load-more-btn" onclick="loadMore()">Load more results →</button>
</div>

<script>
  const params = new URLSearchParams(location.search);
  const ligandId = (params.get('id') || 'ATP').toUpperCase();

  let currentOffset = 0;
  const PAGE_SIZE = 24;
  let totalAvailable = 0;
  let allCards = [];

  // Update breadcrumb
  document.getElementById('bc-id').textContent = ligandId;

  // Fetch metabolite info
  async function loadMetaboliteInfo() {
    try {
      const res = await fetch(`http://localhost:3000/metabolite/${ligandId}`);
      if (!res.ok) throw new Error();
      const d = await res.json();

      document.title = `${d.ligandId} — MolExplorer`;
      document.getElementById('lcode').textContent = d.ligandId;
      document.getElementById('lname').textContent =
        d.name.toLowerCase().replace(/\b\w/g, c => c.toUpperCase());

      document.getElementById('lmeta').innerHTML = `
        <div class="meta-item">
          <label>Formula</label>
          <span>${d.formula}</span>
        </div>
        <div class="meta-item">
          <label>Mol. weight</label>
          <span>${Number(d.molecularWeight).toFixed(3)} g/mol</span>
        </div>
      `;

      document.getElementById('lactions').innerHTML = `
        <a class="btn btn-outline" href="http://localhost:3000/metabolite/${ligandId}/structure" target="_blank">Download SDF</a>
        <a class="btn btn-outline" href="https://www.rcsb.org/ligand/${ligandId}" target="_blank">RCSB page ↗</a>
      `;
    } catch {
      document.getElementById('lname').textContent = ligandId;
    }
  }

  // Build query URL
  function buildUrl(offset) {
    const organism = document.getElementById('f-organism').value.trim();
    const keyword  = document.getElementById('f-keyword').value.trim();
    const gene     = document.getElementById('f-gene').value.trim();
    const limit    = PAGE_SIZE;

    let url = `http://localhost:3000/metabolite/${ligandId}/proteins?limit=${limit}&start=${offset}`;
    if (organism) url += `&organisms=${encodeURIComponent(organism)}`;
    if (keyword)  url += `&keyword=${encodeURIComponent(keyword)}`;
    if (gene)     url += `&gene=${encodeURIComponent(gene)}`;
    return url;
  }

  // Render a batch of protein cards
  function renderCards(proteins) {
    return proteins.map(p => `
      <a class="protein-card" href="https://www.rcsb.org/structure/${p.pdbId}" target="_blank">
        <img class="protein-img"
          src="${p.image}"
          alt="${p.pdbId} structure"
          onerror="this.src='https://placehold.co/300x300/111714/4ac878?text=${p.pdbId}'"
        />
        <div class="protein-info">
          <span class="protein-id">${p.pdbId}</span>
          <span class="protein-arrow">↗</span>
        </div>
      </a>
    `).join('');
  }

  async function loadProteins(reset = false) {
    if (reset) {
      currentOffset = 0;
      allCards = [];
      document.getElementById('protein-grid-wrap').innerHTML =
        `<div class="state-msg loading">// querying RCSB PDB ...</div>`;
      document.getElementById('results-count').textContent = '';
      document.getElementById('load-more-btn').style.display = 'none';
    }

    try {
      const res = await fetch(buildUrl(currentOffset));
      if (!res.ok) throw new Error();
      const data = await res.json();

      totalAvailable = data.totalAvailable || 0;
      const proteins = data.proteins || [];

      allCards = [...allCards, ...proteins];
      currentOffset += proteins.length;

      if (allCards.length === 0) {
        document.getElementById('protein-grid-wrap').innerHTML =
          `<div class="state-msg">// no protein structures found for "${ligandId}" with these filters.</div>`;
        document.getElementById('results-count').textContent = '';
        return;
      }

      document.getElementById('results-count').innerHTML =
        `showing <strong>${allCards.length}</strong> of <strong>${totalAvailable}</strong> structures`;

      document.getElementById('protein-grid-wrap').innerHTML =
        `<div class="protein-grid">${renderCards(allCards)}</div>`;

      // show load more if more exist
      const btn = document.getElementById('load-more-btn');
      if (allCards.length < totalAvailable) {
        btn.style.display = 'block';
        btn.textContent = `Load more — ${totalAvailable - allCards.length} remaining →`;
      } else {
        btn.style.display = 'none';
      }

    } catch (e) {
      document.getElementById('protein-grid-wrap').innerHTML =
        `<div class="state-msg error">// error: could not fetch proteins. Is your server running on port 3000?</div>`;
    }
  }

  async function loadMore() {
    const btn = document.getElementById('load-more-btn');
    btn.textContent = '// loading ...';
    btn.disabled = true;

    try {
      const res = await fetch(buildUrl(currentOffset));
      const data = await res.json();
      const proteins = data.proteins || [];

      allCards = [...allCards, ...proteins];
      currentOffset += proteins.length;

      document.getElementById('results-count').innerHTML =
        `showing <strong>${allCards.length}</strong> of <strong>${totalAvailable}</strong> structures`;

      document.getElementById('protein-grid-wrap').innerHTML =
        `<div class="protein-grid">${renderCards(allCards)}</div>`;

      if (allCards.length < totalAvailable) {
        btn.textContent = `Load more — ${totalAvailable - allCards.length} remaining →`;
        btn.disabled = false;
      } else {
        btn.style.display = 'none';
      }
    } catch {
      btn.textContent = 'Load more →';
      btn.disabled = false;
    }
  }

  // allow Enter key in filters
  ['f-organism','f-keyword','f-gene'].forEach(id => {
    document.getElementById(id).addEventListener('keydown', e => {
      if (e.key === 'Enter') loadProteins(true);
    });
  });

  // init
  loadMetaboliteInfo();
  loadProteins(true);
</script>
</body>
</html>
