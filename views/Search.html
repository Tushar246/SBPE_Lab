<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Search — MolExplorer</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:ital,wght@0,300;0,400;0,500;1,400&family=Syne:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0a0e0d;
    --bg2: #111714;
    --bg3: #1a2219;
    --border: rgba(74,200,120,0.15);
    --border-bright: rgba(74,200,120,0.4);
    --green: #4ac878;
    --green-dim: rgba(74,200,120,0.08);
    --text: #e8f5ee;
    --text-dim: #7a9e85;
    --text-muted: #3d5e47;
    --mono: 'DM Mono', monospace;
    --sans: 'Syne', sans-serif;
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    min-height: 100vh;
  }

  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(rgba(74,200,120,0.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(74,200,120,0.03) 1px, transparent 1px);
    background-size: 40px 40px;
    pointer-events: none;
    z-index: 0;
  }

  nav {
    position: sticky;
    top: 0;
    z-index: 100;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 1rem 2rem;
    background: rgba(10,14,13,0.9);
    backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--border);
  }

  .nav-logo {
    font-size: 1.1rem;
    font-weight: 700;
    letter-spacing: 0.05em;
    color: var(--green);
    text-decoration: none;
  }

  .nav-logo span { color: var(--text-dim); font-weight: 400; }

  nav a {
    font-family: var(--mono);
    font-size: 0.78rem;
    color: var(--text-dim);
    text-decoration: none;
    letter-spacing: 0.05em;
    transition: color 0.2s;
  }

  nav a:hover, nav a.active { color: var(--green); }
  nav ul { list-style: none; display: flex; gap: 2rem; }

  .page {
    position: relative;
    z-index: 1;
    max-width: 1100px;
    margin: 0 auto;
    padding: 3rem 2rem 5rem;
  }

  /* page header */
  .page-title {
    font-size: 2.2rem;
    font-weight: 800;
    letter-spacing: -0.02em;
    margin-bottom: 0.4rem;
  }

  .page-sub {
    font-family: var(--mono);
    font-size: 0.78rem;
    color: var(--text-dim);
    margin-bottom: 2.5rem;
  }

  /* search panel */
  .search-panel {
    background: var(--bg2);
    border: 1px solid var(--border-bright);
    border-radius: 4px;
    padding: 1.6rem;
    margin-bottom: 2rem;
  }

  .panel-row {
    display: grid;
    grid-template-columns: 2fr 1fr 1fr;
    gap: 0.8rem;
    margin-bottom: 0.8rem;
  }

  .panel-row-2 {
    display: grid;
    grid-template-columns: 1fr 1fr auto;
    gap: 0.8rem;
    align-items: end;
  }

  .field-group { display: flex; flex-direction: column; gap: 0.4rem; }

  .field-group label {
    font-family: var(--mono);
    font-size: 0.65rem;
    letter-spacing: 0.1em;
    color: var(--text-muted);
    text-transform: uppercase;
  }

  .field-group input,
  .field-group select {
    background: var(--bg3);
    border: 1px solid var(--border-bright);
    color: var(--text);
    font-family: var(--mono);
    font-size: 0.82rem;
    padding: 0.65rem 0.9rem;
    border-radius: 3px;
    outline: none;
    transition: border-color 0.2s;
    width: 100%;
  }

  .field-group input::placeholder { color: var(--text-muted); }
  .field-group input:focus,
  .field-group select:focus { border-color: var(--green); }
  .field-group select option { background: var(--bg3); }

  .btn-search {
    background: var(--green);
    color: #0a0e0d;
    border: none;
    font-family: var(--mono);
    font-size: 0.78rem;
    font-weight: 500;
    letter-spacing: 0.08em;
    padding: 0.7rem 1.8rem;
    border-radius: 3px;
    cursor: pointer;
    transition: opacity 0.2s;
    white-space: nowrap;
  }

  .btn-search:hover { opacity: 0.85; }

  /* field type descriptions */
  .field-pills {
    display: flex;
    gap: 0.5rem;
    flex-wrap: wrap;
    margin-top: 1rem;
    padding-top: 1rem;
    border-top: 1px solid var(--border);
  }

  .field-pill {
    font-family: var(--mono);
    font-size: 0.68rem;
    letter-spacing: 0.05em;
    padding: 0.25rem 0.7rem;
    border-radius: 2px;
    border: 1px solid var(--border);
    color: var(--text-muted);
    cursor: pointer;
    transition: all 0.15s;
    background: transparent;
  }

  .field-pill:hover,
  .field-pill.active {
    border-color: var(--green);
    color: var(--green);
    background: var(--green-dim);
  }

  /* quick examples */
  .examples {
    margin-bottom: 2rem;
  }

  .examples-title {
    font-family: var(--mono);
    font-size: 0.68rem;
    letter-spacing: 0.1em;
    color: var(--text-muted);
    text-transform: uppercase;
    margin-bottom: 0.8rem;
  }

  .example-chips {
    display: flex;
    flex-wrap: wrap;
    gap: 0.5rem;
  }

  .example-chip {
    font-family: var(--mono);
    font-size: 0.72rem;
    letter-spacing: 0.05em;
    color: var(--text-dim);
    border: 1px solid var(--border);
    padding: 0.3rem 0.8rem;
    border-radius: 2px;
    cursor: pointer;
    transition: all 0.15s;
    background: transparent;
  }

  .example-chip:hover {
    border-color: var(--green);
    color: var(--green);
    background: var(--green-dim);
  }

  /* results */
  .results-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 1.2rem;
  }

  .results-count {
    font-family: var(--mono);
    font-size: 0.75rem;
    color: var(--text-muted);
  }

  .results-count strong { color: var(--green); }

  .result-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
    gap: 1px;
    background: var(--border);
    border: 1px solid var(--border);
  }

  .result-card {
    background: var(--bg2);
    display: block;
    text-decoration: none;
    transition: background 0.15s;
    overflow: hidden;
  }

  .result-card:hover { background: var(--bg3); }

  .result-img {
    width: 100%;
    aspect-ratio: 1;
    object-fit: cover;
    display: block;
    border-bottom: 1px solid var(--border);
    filter: saturate(0.6) brightness(0.9);
    transition: filter 0.3s;
  }

  .result-card:hover .result-img { filter: saturate(1) brightness(1); }

  .result-footer {
    padding: 0.85rem 1rem;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .result-id {
    font-family: var(--mono);
    font-size: 0.9rem;
    font-weight: 500;
    letter-spacing: 0.08em;
  }

  .result-arrow {
    font-family: var(--mono);
    font-size: 0.72rem;
    color: var(--text-muted);
    transition: color 0.15s;
  }

  .result-card:hover .result-arrow { color: var(--green); }

  .state-msg {
    font-family: var(--mono);
    font-size: 0.82rem;
    padding: 4rem 2rem;
    text-align: center;
    color: var(--text-muted);
    border: 1px solid var(--border);
    border-radius: 4px;
  }

  .state-msg.loading { color: var(--green); }
  .state-msg.error { color: #f07070; border-color: rgba(220,50,50,0.3); }

  .load-more {
    margin-top: 1px;
    width: 100%;
    background: var(--bg2);
    border: none;
    border-top: 1px solid var(--border);
    color: var(--text-dim);
    font-family: var(--mono);
    font-size: 0.75rem;
    letter-spacing: 0.08em;
    padding: 1.1rem;
    cursor: pointer;
    transition: all 0.15s;
    display: none;
  }

  .load-more:hover { background: var(--bg3); color: var(--green); }
</style>
</head>
<body>

<nav>
  <a href="index.html" class="nav-logo">Mol<span>Explorer</span></a>
  <ul>
    <li><a href="index.html">Home</a></li>
    <li><a href="search.html" class="active">Search</a></li>
    <li><a href="https://www.rcsb.org" target="_blank">RCSB PDB ↗</a></li>
  </ul>
</nav>

<div class="page">
  <div class="page-title">Search structures</div>
  <div class="page-sub">// Search across all 220,000+ entries in the RCSB Protein Data Bank</div>

  <div class="search-panel">
    <div class="panel-row">
      <div class="field-group">
        <label>Keyword</label>
        <input type="text" id="s-keyword" placeholder="kinase, insulin, covid, photosynthesis ..." />
      </div>
      <div class="field-group">
        <label>Search field</label>
        <select id="s-field">
          <option value="full_text">Full text (everything)</option>
          <option value="title">Title only</option>
          <option value="gene">Gene name</option>
          <option value="disease">Disease</option>
        </select>
      </div>
      <div class="field-group">
        <label>Results limit</label>
        <select id="s-limit">
          <option value="24">24</option>
          <option value="50">50</option>
          <option value="100">100</option>
        </select>
      </div>
    </div>

    <div class="panel-row-2">
      <div class="field-group">
        <label>Organism (optional)</label>
        <input type="text" id="s-organism" placeholder="e.g. Homo sapiens, Arabidopsis thaliana" />
      </div>
      <div></div>
      <button class="btn-search" onclick="runSearch(true)">Search →</button>
    </div>

    <!-- field type helper pills -->
    <div class="field-pills">
      <span style="font-family:var(--mono);font-size:0.65rem;color:var(--text-muted);letter-spacing:0.05em;align-self:center;">Quick field:</span>
      <button class="field-pill active" onclick="setField('full_text',this)">full text</button>
      <button class="field-pill" onclick="setField('title',this)">title</button>
      <button class="field-pill" onclick="setField('gene',this)">gene name</button>
      <button class="field-pill" onclick="setField('disease',this)">disease</button>
    </div>
  </div>

  <!-- example searches -->
  <div class="examples">
    <div class="examples-title">// Try an example</div>
    <div class="example-chips">
      <button class="example-chip" onclick="quickSearch('kinase','full_text','')">kinase</button>
      <button class="example-chip" onclick="quickSearch('insulin','full_text','Homo sapiens')">insulin · human</button>
      <button class="example-chip" onclick="quickSearch('covid','full_text','')">covid</button>
      <button class="example-chip" onclick="quickSearch('photosynthesis','title','Arabidopsis thaliana')">photosynthesis · arabidopsis</button>
      <button class="example-chip" onclick="quickSearch('TP53','gene','')">gene: TP53</button>
      <button class="example-chip" onclick="quickSearch('BRCA1','gene','')">gene: BRCA1</button>
      <button class="example-chip" onclick="quickSearch('ACE2','gene','')">gene: ACE2</button>
      <button class="example-chip" onclick="quickSearch('EGFR','gene','Homo sapiens')">gene: EGFR · human</button>
      <button class="example-chip" onclick="quickSearch('cancer','disease','')">disease: cancer</button>
      <button class="example-chip" onclick="quickSearch('alzheimer','disease','')">disease: alzheimer</button>
    </div>
  </div>

  <div class="results-bar">
    <div class="results-count" id="results-count"></div>
  </div>

  <div id="results-wrap">
    <div class="state-msg">// enter a keyword above and press Search</div>
  </div>

  <button class="load-more" id="load-more-btn" onclick="loadMore()">Load more →</button>
</div>

<script>
  let currentKeyword = '';
  let currentField = 'full_text';
  let currentOrganism = '';
  let currentLimit = 24;
  let currentOffset = 0;
  let totalAvailable = 0;
  let allCards = [];

  function setField(val, el) {
    document.getElementById('s-field').value = val;
    document.querySelectorAll('.field-pill').forEach(p => p.classList.remove('active'));
    el.classList.add('active');
  }

  // sync pills when select changes
  document.getElementById('s-field').addEventListener('change', function() {
    const val = this.value;
    document.querySelectorAll('.field-pill').forEach(p => {
      p.classList.toggle('active', p.textContent.trim().replace(' ', '_') === val
        || (val === 'full_text' && p.textContent.trim() === 'full text'));
    });
  });

  function quickSearch(keyword, field, organism) {
    document.getElementById('s-keyword').value = keyword;
    document.getElementById('s-field').value = field;
    document.getElementById('s-organism').value = organism;
    document.querySelectorAll('.field-pill').forEach(p => {
      const t = p.textContent.trim().replace(' ', '_');
      p.classList.toggle('active', t === field || (field === 'full_text' && p.textContent.trim() === 'full text'));
    });
    runSearch(true);
  }

  function buildUrl(offset) {
    const keyword  = document.getElementById('s-keyword').value.trim();
    const field    = document.getElementById('s-field').value;
    const organism = document.getElementById('s-organism').value.trim();
    const limit    = parseInt(document.getElementById('s-limit').value);

    let url = `http://localhost:3000/search?keyword=${encodeURIComponent(keyword)}&field=${field}&limit=${limit}`;
    if (organism) url += `&organism=${encodeURIComponent(organism)}`;
    return url;
  }

  function renderCards(items) {
    return items.map(item => `
      <a class="result-card" href="https://www.rcsb.org/structure/${item.pdbId}" target="_blank">
        <img class="result-img"
          src="${item.image}"
          alt="${item.pdbId}"
          onerror="this.src='https://placehold.co/300x300/111714/4ac878?text=${item.pdbId}'"
        />
        <div class="result-footer">
          <span class="result-id">${item.pdbId}</span>
          <span class="result-arrow">↗</span>
        </div>
      </a>
    `).join('');
  }

  async function runSearch(reset = false) {
    const keyword = document.getElementById('s-keyword').value.trim();
    if (!keyword) return;

    if (reset) {
      currentOffset = 0;
      allCards = [];
      document.getElementById('results-wrap').innerHTML =
        `<div class="state-msg loading">// searching RCSB PDB for "${keyword}" ...</div>`;
      document.getElementById('results-count').textContent = '';
      document.getElementById('load-more-btn').style.display = 'none';
    }

    try {
      const res = await fetch(buildUrl(currentOffset));
      if (!res.ok) throw new Error();
      const data = await res.json();

      totalAvailable = data.totalAvailable || 0;
      const items = data.results || [];

      allCards = [...allCards, ...items];
      currentOffset += items.length;

      if (allCards.length === 0) {
        document.getElementById('results-wrap').innerHTML =
          `<div class="state-msg">// no results found for "${keyword}". Try different keywords or field.</div>`;
        document.getElementById('results-count').textContent = '';
        return;
      }

      document.getElementById('results-count').innerHTML =
        `showing <strong>${allCards.length}</strong> of <strong>${totalAvailable}</strong> structures`;

      document.getElementById('results-wrap').innerHTML =
        `<div class="result-grid">${renderCards(allCards)}</div>`;

      const btn = document.getElementById('load-more-btn');
      if (allCards.length < totalAvailable) {
        btn.style.display = 'block';
        btn.textContent = `Load more — ${totalAvailable - allCards.length} remaining →`;
      } else {
        btn.style.display = 'none';
      }

    } catch (e) {
      document.getElementById('results-wrap').innerHTML =
        `<div class="state-msg error">// error: could not connect to server. Is it running on port 3000?</div>`;
    }
  }

  async function loadMore() {
    const btn = document.getElementById('load-more-btn');
    btn.textContent = '// loading ...';
    btn.disabled = true;

    try {
      const res = await fetch(buildUrl(currentOffset));
      const data = await res.json();
      const items = data.results || [];

      allCards = [...allCards, ...items];
      currentOffset += items.length;

      document.getElementById('results-count').innerHTML =
        `showing <strong>${allCards.length}</strong> of <strong>${totalAvailable}</strong> structures`;

      document.getElementById('results-wrap').innerHTML =
        `<div class="result-grid">${renderCards(allCards)}</div>`;

      if (allCards.length < totalAvailable) {
        btn.textContent = `Load more — ${totalAvailable - allCards.length} remaining →`;
        btn.disabled = false;
      } else {
        btn.style.display = 'none';
      }
    } catch {
      btn.textContent = 'Load more →';
      btn.disabled = false;
    }
  }

  // Enter key support
  ['s-keyword','s-organism'].forEach(id => {
    document.getElementById(id).addEventListener('keydown', e => {
      if (e.key === 'Enter') runSearch(true);
    });
  });

  // pre-fill from URL params if any
  const p = new URLSearchParams(location.search);
  if (p.get('keyword')) {
    document.getElementById('s-keyword').value = p.get('keyword');
    if (p.get('field')) document.getElementById('s-field').value = p.get('field');
    runSearch(true);
  }
</script>
</body>
</html>
